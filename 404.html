<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — David</title>
<meta name="description" content="That page doesn't exist." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#08090c" />

<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="css/style.css" />

<script>document.documentElement.classList.add("js");</script>
</head>

<body class="dark">

<main class="notfound">
    <div class="container">
        <p class="eyebrow">Error</p>
        <p class="notfound__code">404</p>
        <h1 class="h2" style="margin-top:1rem">This page took a wrong turn</h1>
        <p class="lead" style="margin:1rem auto 0; max-width:34rem">
            The link is broken or the page has moved. Nothing here is on fire — let's get you back.
        </p>

        <div class="notfound__actions">
            <a class="btn btn--primary btn--lg" href="/">
                <span class="btn__label">
                    Back home
                    <svg class="btn__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6" />
                    </svg>
                </span>
            </a>
            <a class="btn btn--ghost btn--lg" href="/projects.html">
                <span class="btn__label">See the work</span>
            </a>
        </div>
    </div>
</main>

<script src="js/main.js" defer></script>
</body>
</html>
